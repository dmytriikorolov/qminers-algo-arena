[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-arena-lab"
version = "0.1.0"
description = "Offline competition preparation baselines, not an official submission"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
reports = ["reportlab>=4,<5", "pypdf>=5,<7"]
optimization = ["scipy>=1.11,<2"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
